<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Page-specific minor overrides (kept minimal so global header from style.css applies) */
    .login-container { padding: 20px; }
    .login-box { max-width: 380px; }
    input[type="text"], input[type="password"] { font-size: 15px; }
  </style>
</head>
<body>
  <header>
    <h1>🎵 Admin Login</h1>
  </header>

  <div class="login-container">
    <div class="login-box">
      <h2>Login to Admin Panel</h2>
      <form id="adminLoginForm">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Login</button>
        <p class="error" id="errorMsg"></p>
      </form>
    </div>
  </div>

  <footer>
    <p>© 2025 Your Music Library | Admin Access</p>
  </footer>

  <script>
    const form = document.getElementById("adminLoginForm");
    const errorMsg = document.getElementById("errorMsg");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      // You can change these credentials as needed
      const adminUser = "admin";
      const adminPass = "12345";

      if (username === adminUser && password === adminPass) {
        localStorage.setItem("adminLoggedIn", "true");
        window.location.href = "admin.html"; // redirect to admin panel
      } else {
        errorMsg.textContent = "Invalid username or password!";
      }
    });
  </script>
</body>
</html>
